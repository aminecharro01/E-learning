spring:
  application:
    name: iat-academy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/iat_academy}
    username: ${DB_USER:iat}
    password: ${DB_PASSWORD:iat_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  servlet:
    multipart:
      # Generous enough for course videos/PDFs without leaving the upload endpoint
      # wide open as a disk-exhaustion vector.
      max-file-size: 200MB
      max-request-size: 210MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # No fallback here on purpose: JWT_SECRET must be set explicitly (dev profile
    # supplies its own local-only value). Booting without it fails fast — see
    # JwtProperties#validate — instead of silently signing tokens with a secret
    # that's sitting in this file in plain text.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: ${JWT_COOKIE_NAME:iat_token}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  media:
    root-path: ${MEDIA_ROOT:../data/media}
    signed-url-ttl-seconds: ${MEDIA_SIGNED_TTL:3600}
    signing-secret: ${MEDIA_SIGNING_SECRET:}
    max-image-size-bytes: ${MEDIA_MAX_IMAGE_BYTES:5242880}
    max-document-size-bytes: ${MEDIA_MAX_DOCUMENT_BYTES:15728640}
    max-video-size-bytes: ${MEDIA_MAX_VIDEO_BYTES:209715200}
  bunny:
    # Off by default — video keeps going to local disk (app.media.root-path) until
    # this is explicitly turned on with real credentials from the Bunny dashboard
    # (Stream > your library > API tab).
    enabled: ${BUNNY_STREAM_ENABLED:false}
    library-id: ${BUNNY_LIBRARY_ID:}
    api-key: ${BUNNY_API_KEY:}
    pull-zone-hostname: ${BUNNY_PULL_ZONE_HOSTNAME:}
  platform:
    name: ${APP_PLATFORM_NAME:IAT Academy}
    support-email: ${APP_SUPPORT_EMAIL:support@iat-academy.local}
    registration-enabled: ${APP_REGISTRATION_ENABLED:true}
    default-reset-password: ${APP_DEFAULT_RESET_PASSWORD:IatReset@123}
  mail:
    # Off by default so local/dev boots without real SMTP creds — EmailServiceImpl
    # logs the message instead of sending when disabled. Set MAIL_ENABLED=true and
    # supply spring.mail.* creds (MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD) to send for real.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@iat-academy.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins:
      - ${CORS_ORIGINS:http://localhost:3000}
  security:
    # IPs of reverse proxies allowed to set X-Forwarded-For (comma-separated).
    # Leave empty (default) unless the API sits behind a known proxy/load balancer —
    # otherwise the header is attacker-controlled and must be ignored.
    trusted-proxies: ${TRUSTED_PROXIES:}
  quiz:
    # TODO: à valider avec le client
    default-section-passing-score: 50
    default-module-passing-score: 60
    default-module-max-attempts: 2
    default-module-time-limit-seconds: 5400
    default-retry-delay-hours: 24
    section-completion-video-percent: 90
  demo:
    # Remet progression / certificats / validations UF à chaque démarrage (scénarios démo)
    reset-progress-on-startup: ${DEMO_RESET_PROGRESS:true}
  swagger:
    # See SecurityConfig — also gates whether swagger paths are publicly reachable.
    enabled: ${SWAGGER_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.iatacademy: INFO
