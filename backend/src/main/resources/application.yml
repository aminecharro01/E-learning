spring:
  application:
    name: iat-academy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/iat_academy}
    username: ${DB_USER:iat}
    password: ${DB_PASSWORD:iat_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: ${JWT_COOKIE_NAME:iat_token}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  media:
    root-path: ${MEDIA_ROOT:../data/media}
    signed-url-ttl-seconds: ${MEDIA_SIGNED_TTL:3600}
    signing-secret: ${MEDIA_SIGNING_SECRET:}
  cors:
    allowed-origins:
      - ${CORS_ORIGINS:http://localhost:3000}
  quiz:
    # TODO: à valider avec le client
    default-section-passing-score: 50
    default-module-passing-score: 60
    default-module-max-attempts: 2
    default-module-time-limit-seconds: 5400
    default-retry-delay-hours: 24
    section-completion-video-percent: 90

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.iatacademy: INFO
