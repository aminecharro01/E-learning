# IAT Academy — Nginx reverse proxy + secure media
# In production, terminate TLS here and set secure cookies.

upstream iat_api {
    server api:8080;
}

upstream iat_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 520m;

    # Next.js frontend
    location / {
        proxy_pass http://iat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Spring Boot API
    location /api/ {
        proxy_pass http://iat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /swagger-ui/ {
        proxy_pass http://iat_api;
    }

    location /api-docs {
        proxy_pass http://iat_api;
    }

    # Internal-only media directory (use with X-Accel-Redirect from Spring in later hardening)
    location /internal-media/ {
        internal;
        alias /data/media/;
    }
}
